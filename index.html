<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Violet Blue — suilx</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: Georgia, "Times New Roman", "Yu Mincho", "Hiragino Mincho ProN", serif;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    color: #fff;
    position: relative;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: absolute;
    top: -42%;
    left: 50%;
    transform: translateX(-50%);
    width: 130vmax;
    height: 80vh;
    background: radial-gradient(ellipse at center, rgba(255,255,255,.16), rgba(255,255,255,0) 68%);
    pointer-events: none;
  }
  .card {
    position: relative;
    z-index: 2;
    text-align: center;
    width: min(520px, 92vw);
    padding: 40px 20px;
  }
  .cross {
    font-size: 24px;
    color: #8a8a8a;
    margin-bottom: 20px;
    font-weight: 400;
    line-height: 1;
  }
  .title {
    font-size: 28px;
    font-weight: 400;
    letter-spacing: .32em;
    padding-left: .32em;
    text-transform: uppercase;
    color: #f2f2f2;
    white-space: nowrap;
  }
  .rule {
    width: 100%;
    height: 1px;
    background: #2c2c2c;
    margin: 30px 0;
  }
  .player {
    display: flex;
    align-items: center;
    gap: 18px;
    width: 100%;
  }
  .btn {
    flex: none;
    width: 46px;
    height: 46px;
    border: 1px solid #666;
    border-radius: 50%;
    background: transparent;
    color: #eee;
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color .2s, color .2s;
  }
  .btn:hover { border-color: #fff; color: #fff; }
  .bar {
    flex: 1;
    height: 2px;
    background: #2c2c2c;
    position: relative;
    cursor: pointer;
  }
  .fill {
    position: absolute;
    left: 0; top: 0;
    height: 100%;
    width: 0%;
    background: #e8e8e8;
  }
  .dot {
    position: absolute;
    top: 50%;
    left: 0%;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: #fff;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .time {
    flex: none;
    font-size: 13px;
    color: #7d7d7d;
    letter-spacing: .06em;
    min-width: 78px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .link {
    display: inline-block;
    font-size: 20px;
    letter-spacing: .22em;
    padding-left: .22em;
    color: #b5b5b5;
    text-decoration: none;
    cursor: pointer;
    transition: color .2s, border-color .2s;
    border-bottom: 1px solid transparent;
  }
  .link:hover {
    color: #fff;
    border-bottom-color: #fff;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="cross">✝</div>
    <div class="title">Violet Blue</div>
    <div class="rule"></div>

    <div class="player">
      <button class="btn" id="btn">▶</button>
      <div class="bar" id="bar">
        <div class="fill" id="fill"></div>
        <div class="dot" id="dot"></div>
      </div>
      <div class="time" id="time">0:00 / 6:08</div>
    </div>

    <div class="rule"></div>

    <a class="link" href="https://steamcommunity.com/id/suilx/" target="_blank" rel="noopener">suilx</a>
  </div>

  <audio id="a" src="chara_violet_blue.mp3" loop preload="auto"></audio>

  <script>
    const a = document.getElementById('a');
    const btn = document.getElementById('btn');
    const bar = document.getElementById('bar');
    const fill = document.getElementById('fill');
    const dot = document.getElementById('dot');
    const time = document.getElementById('time');

    function fmt(s) {
      if (!isFinite(s)) return '0:00';
      s = Math.floor(s);
      const m = Math.floor(s / 60);
      const sec = (s % 60).toString().padStart(2, '0');
      return m + ':' + sec;
    }
    function render() {
      const d = a.duration || 1;
      const pct = (a.currentTime / d) * 100;
      fill.style.width = pct + '%';
      dot.style.left = pct + '%';
      time.textContent = fmt(a.currentTime) + ' / ' + (isFinite(a.duration) ? fmt(a.duration) : '6:08');
      btn.textContent = a.paused ? '▶' : '❚❚';
    }
    function toggle() {
      if (a.paused) {
        a.play().catch(() => {});
      } else {
        a.pause();
      }
    }

    btn.addEventListener('click', toggle);
    bar.addEventListener('click', (e) => {
      const r = bar.getBoundingClientRect();
      const pct = (e.clientX - r.left) / r.width;
      if (isFinite(a.duration)) a.currentTime = pct * a.duration;
      render();
    });

    a.addEventListener('timeupdate', render);
    a.addEventListener('loadedmetadata', render);
    a.addEventListener('play', render);
    a.addEventListener('pause', render);
    a.addEventListener('ended', render);

    a.play().then(render).catch(() => render());
    render();
  </script>
</body>
</html>
